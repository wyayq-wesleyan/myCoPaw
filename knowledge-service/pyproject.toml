[project]
name = "huizhi-knowledge-service"
version = "0.1.4"
description = "Offline document knowledge service for Huizhi Assistant"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "python-docx>=1.1",
  "openpyxl>=3.1",
    "PyMuPDF>=1.24",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
enhanced = [
  "lightrag-hku==1.5.6",
  "mineru==3.4.5",
]
