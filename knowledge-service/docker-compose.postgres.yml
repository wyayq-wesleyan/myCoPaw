services:
  knowledge-postgres:
    # pgvector 官方镜像（Debian 版 PG 17 + vector 扩展）。选它而不是
    # postgres:17-alpine，是因为 alpine 镜像既不含 vector 也无法安装（没有
    # .control 文件），而本环境的检索/图存储改造需要该扩展。生产环境用的就是
    # 这个镜像，本地与之对齐才能测出真实行为。
    # 注意：数据目录在 ./postgres-data（bind mount），换镜像不丢数据；但与
    # alpine 的 libc 不同（glibc vs musl），升级前请先 pg_dumpall 备份。
    image: "${KNOWLEDGE_POSTGRES_IMAGE:-pgvector/pgvector:pg17}"
    container_name: huizhi-knowledge-postgres
    restart: unless-stopped
    mem_limit: "${KNOWLEDGE_POSTGRES_MEMORY_LIMIT:-32g}"
    cpus: "${KNOWLEDGE_POSTGRES_CPU_LIMIT:-4.0}"
    pids_limit: "${KNOWLEDGE_POSTGRES_PIDS_LIMIT:-256}"
    environment:
      POSTGRES_DB: "${KNOWLEDGE_POSTGRES_DB:-huizhi_knowledge}"
      POSTGRES_USER: "${KNOWLEDGE_POSTGRES_USER:-huizhi_knowledge}"
      POSTGRES_PASSWORD: "${KNOWLEDGE_POSTGRES_PASSWORD:-huizhi_knowledge}"
      TZ: "${TZ:-Asia/Shanghai}"
    ports:
      - "127.0.0.1:${KNOWLEDGE_POSTGRES_PORT:-15432}:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      # 首次初始化时建知识图谱库（多租户 workspace 存储）。数据目录已存在时
      # 不会执行；那种情况按 README 里的手工命令创建。
      - ./initdb:/docker-entrypoint-initdb.d:ro
    # The platform store (conversation history, audit) shares this instance with
    # the knowledge service and the per-account analysis databases, so the
    # default 100-connection ceiling is too low: the analysis pools alone can
    # reach ~40 and history adds a pool on top. Raised explicitly rather than
    # left to the image default so the ceiling is visible and intentional.
    command: ["postgres", "-c", "max_connections=${KNOWLEDGE_POSTGRES_MAX_CONNECTIONS:-200}"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
