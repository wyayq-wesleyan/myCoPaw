services:
  knowledge-postgres:
    # pgvector 官方镜像（Debian 版 PG 17 + vector 扩展），与生产一致。
    # postgres:17-alpine 既不含该扩展也无法安装。数据在 ./postgres-data
    # （bind mount），换镜像不丢；glibc/musl 不同，升级前先 pg_dumpall 备份。
    image: "${KNOWLEDGE_POSTGRES_IMAGE:-pgvector/pgvector:pg17}"
    container_name: huizhi-knowledge-postgres
    restart: unless-stopped
    mem_limit: "${KNOWLEDGE_POSTGRES_MEMORY_LIMIT:-32g}"
    cpus: "${KNOWLEDGE_POSTGRES_CPU_LIMIT:-4.0}"
    pids_limit: "${KNOWLEDGE_POSTGRES_PIDS_LIMIT:-256}"
    environment:
      POSTGRES_DB: "${KNOWLEDGE_POSTGRES_DB:-huizhi_knowledge}"
      POSTGRES_USER: "${KNOWLEDGE_POSTGRES_USER:-huizhi_knowledge}"
      POSTGRES_PASSWORD: "${KNOWLEDGE_POSTGRES_PASSWORD:-huizhi_knowledge}"
      TZ: "${TZ:-Asia/Shanghai}"
    ports:
      - "127.0.0.1:${KNOWLEDGE_POSTGRES_PORT:-15432}:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    # The platform store (conversation history, audit) shares this instance with
    # the knowledge service and the per-account analysis databases, so the
    # default 100-connection ceiling is too low: the analysis pools alone can
    # reach ~40 and history adds a pool on top. Raised explicitly rather than
    # left to the image default so the ceiling is visible and intentional.
    command: ["postgres", "-c", "max_connections=${KNOWLEDGE_POSTGRES_MAX_CONNECTIONS:-200}"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  knowledge-api:
    build:
      context: .
      args:
        BASE_IMAGE: "${BASE_IMAGE:-py312-base:2.0.2-amd64}"
        INSTALL_KNOWLEDGE_EXTRAS: "${INSTALL_KNOWLEDGE_EXTRAS:-0}"
        PRELOAD_MINERU_MODELS: "${PRELOAD_MINERU_MODELS:-1}"
    image: "${KNOWLEDGE_IMAGE:-huizhi-knowledge:0.1.4-arm64}"
    container_name: huizhi-knowledge-api
    restart: unless-stopped
    mem_limit: "${KNOWLEDGE_API_MEMORY_LIMIT:-16g}"
    cpus: "${KNOWLEDGE_API_CPU_LIMIT:-4.0}"
    pids_limit: "${KNOWLEDGE_API_PIDS_LIMIT:-256}"
    env_file:
      - .env
    environment:
      KNOWLEDGE_ROLE: api
      KNOWLEDGE_DATABASE_URL: "${KNOWLEDGE_DATABASE_URL:-postgresql://huizhi_knowledge:huizhi_knowledge@knowledge-postgres:5432/huizhi_knowledge}"
      KNOWLEDGE_OFFLINE: "${KNOWLEDGE_OFFLINE:-false}"
      MINERU_MODEL_SOURCE: "${MINERU_MODEL_SOURCE:-local}"
      LIGHTRAG_URL: "${LIGHTRAG_URL:-http://lightrag:9621}"
      # Tenant-isolated graph storage (docs/知识服务多租户存储设计方案.md).
      # Set to a PostgreSQL DSN to run the graph **in-process** with one LightRAG
      # workspace per path, which replaces LIGHTRAG_URL. Leave empty to keep the
      # legacy shared graph — existing deployments are unaffected until switched.
      KNOWLEDGE_GRAPH_DATABASE_URL: "${KNOWLEDGE_GRAPH_DATABASE_URL:-}"
      KNOWLEDGE_GRAPH_MAX_WORKSPACES: "${KNOWLEDGE_GRAPH_MAX_WORKSPACES:-32}"
      KNOWLEDGE_GRAPH_POOL_MAX_CONNECTIONS: "${KNOWLEDGE_GRAPH_POOL_MAX_CONNECTIONS:-8}"
    depends_on:
      knowledge-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KNOWLEDGE_PORT:-18100}:18100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  knowledge-worker:
    image: "${KNOWLEDGE_IMAGE:-huizhi-knowledge:0.1.4-arm64}"
    container_name: huizhi-knowledge-worker
    restart: unless-stopped
    mem_limit: "${KNOWLEDGE_WORKER_MEMORY_LIMIT:-80g}"
    cpus: "${KNOWLEDGE_WORKER_CPU_LIMIT:-14.0}"
    pids_limit: "${KNOWLEDGE_WORKER_PIDS_LIMIT:-256}"
    env_file:
      - .env
    environment:
      KNOWLEDGE_ROLE: worker
      KNOWLEDGE_DATABASE_URL: "${KNOWLEDGE_DATABASE_URL:-postgresql://huizhi_knowledge:huizhi_knowledge@knowledge-postgres:5432/huizhi_knowledge}"
      KNOWLEDGE_OFFLINE: "${KNOWLEDGE_OFFLINE:-false}"
      MINERU_MODEL_SOURCE: "${MINERU_MODEL_SOURCE:-local}"
      LIGHTRAG_URL: "${LIGHTRAG_URL:-http://lightrag:9621}"
      KNOWLEDGE_GRAPH_DATABASE_URL: "${KNOWLEDGE_GRAPH_DATABASE_URL:-}"
      KNOWLEDGE_GRAPH_MAX_WORKSPACES: "${KNOWLEDGE_GRAPH_MAX_WORKSPACES:-32}"
      KNOWLEDGE_GRAPH_POOL_MAX_CONNECTIONS: "${KNOWLEDGE_GRAPH_POOL_MAX_CONNECTIONS:-8}"
    depends_on:
      knowledge-postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    command: ["python", "-m", "app.worker"]

  lightrag:
    image: "${KNOWLEDGE_IMAGE:-huizhi-knowledge:0.1.4-arm64}"
    container_name: huizhi-lightrag
    restart: unless-stopped
    mem_limit: "${LIGHTRAG_MEMORY_LIMIT:-32g}"
    cpus: "${LIGHTRAG_CPU_LIMIT:-4.0}"
    pids_limit: "${LIGHTRAG_PIDS_LIMIT:-256}"
    env_file:
      - .env
    environment:
      LLM_BINDING: openai
      LLM_BINDING_HOST: "${PROVIDER_BASE_URL:-http://host.docker.internal:9988/v1}"
      LLM_BINDING_API_KEY: "${PROVIDER_API_KEY:-}"
      OPENAI_API_KEY: "${PROVIDER_API_KEY:-}"
      LLM_MODEL: "${CHAT_MODEL:-llm}"
      EMBEDDING_BINDING: openai
      EMBEDDING_BINDING_HOST: "${EMBEDDING_BASE_URL:-http://host.docker.internal:9988/v1}"
      EMBEDDING_BINDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      OPENAI_EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-qwen3-4b-embedding}"
      EMBEDDING_DIM: "${EMBEDDING_DIMENSIONS:-1024}"
      SUMMARY_LANGUAGE: Chinese
      WORKING_DIR: /data/lightrag
      TIKTOKEN_CACHE_DIR: /data/lightrag/tiktoken_cache
      LIGHTRAG_API_KEY: "${LIGHTRAG_API_KEY:-}"
    command: ["python", "-m", "lightrag.api.lightrag_server", "--host", "0.0.0.0", "--port", "9621"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${LIGHTRAG_PORT:-19621}:9621"
    volumes:
      - ./data/lightrag:/data/lightrag
      - ./data/lightrag-input:/data/lightrag-input
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9621/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
