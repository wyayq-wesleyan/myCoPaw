services:
  knowledge-api:
    image: "${KNOWLEDGE_IMAGE:-huizhi-runtime:2.2.1-arm64}"
    container_name: huizhi-knowledge-api
    restart: unless-stopped
    mem_limit: "${KNOWLEDGE_API_MEMORY_LIMIT:-16g}"
    cpus: "${KNOWLEDGE_API_CPU_LIMIT:-4.0}"
    pids_limit: "${KNOWLEDGE_API_PIDS_LIMIT:-256}"
    env_file:
      - .env
    environment:
      KNOWLEDGE_ROLE: api
      KNOWLEDGE_CODE_DIR: /opt/huizhi-knowledge
      PYTHONPATH: /opt/huizhi-knowledge
      # PostgreSQL is maintained by docker-compose.postgres.yml separately.
      # Reach its host-bound port from this independent Compose project.
      KNOWLEDGE_DATABASE_URL: "${KNOWLEDGE_DATABASE_URL:-postgresql://huizhi_knowledge:huizhi_knowledge@host.docker.internal:15432/huizhi_knowledge}"
      KNOWLEDGE_OFFLINE: "${KNOWLEDGE_OFFLINE:-false}"
      MINERU_MODEL_SOURCE: "${MINERU_MODEL_SOURCE:-local}"
      LIGHTRAG_URL: "${LIGHTRAG_URL:-http://lightrag:9621}"
      # 知识图谱多租户（docs/知识服务多租户存储设计方案.md）。
      # 填 PostgreSQL DSN 即启用「进程内 LightRAG + 每路径一个 workspace」，
      # 此时 LIGHTRAG_URL 不再使用；留空保持旧的共享图谱行为。
      KNOWLEDGE_GRAPH_DATABASE_URL: "${KNOWLEDGE_GRAPH_DATABASE_URL:-}"
      KNOWLEDGE_GRAPH_MAX_WORKSPACES: "${KNOWLEDGE_GRAPH_MAX_WORKSPACES:-32}"
      KNOWLEDGE_GRAPH_POOL_MAX_CONNECTIONS: "${KNOWLEDGE_GRAPH_POOL_MAX_CONNECTIONS:-8}"
      # Log files land here; the host directory below is mounted over it.
      KNOWLEDGE_LOG_DIR: /var/log/knowledge
      KNOWLEDGE_SQL_LOG: "${KNOWLEDGE_SQL_LOG:-true}"
    ports:
      - "127.0.0.1:${KNOWLEDGE_PORT:-18100}:18100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/opt/huizhi-knowledge/app:ro
      - ./scripts:/opt/huizhi-knowledge/scripts:ro
      - ./data:/data
      # Persist logs on the host, like the main application's QWENPAW_LOG_DIR.
      - ${KNOWLEDGE_HOST_LOG_DIR:-./data/logs}:/var/log/knowledge
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "18100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  knowledge-worker:
    image: "${KNOWLEDGE_IMAGE:-huizhi-runtime:2.2.1-arm64}"
    container_name: huizhi-knowledge-worker
    restart: unless-stopped
    mem_limit: "${KNOWLEDGE_WORKER_MEMORY_LIMIT:-80g}"
    cpus: "${KNOWLEDGE_WORKER_CPU_LIMIT:-14.0}"
    pids_limit: "${KNOWLEDGE_WORKER_PIDS_LIMIT:-256}"
    env_file:
      - .env
    environment:
      KNOWLEDGE_ROLE: worker
      KNOWLEDGE_CODE_DIR: /opt/huizhi-knowledge
      PYTHONPATH: /opt/huizhi-knowledge
      KNOWLEDGE_DATABASE_URL: "${KNOWLEDGE_DATABASE_URL:-postgresql://huizhi_knowledge:huizhi_knowledge@host.docker.internal:15432/huizhi_knowledge}"
      KNOWLEDGE_OFFLINE: "${KNOWLEDGE_OFFLINE:-false}"
      MINERU_MODEL_SOURCE: "${MINERU_MODEL_SOURCE:-local}"
      LIGHTRAG_URL: "${LIGHTRAG_URL:-http://lightrag:9621}"
      KNOWLEDGE_GRAPH_DATABASE_URL: "${KNOWLEDGE_GRAPH_DATABASE_URL:-}"
      KNOWLEDGE_GRAPH_MAX_WORKSPACES: "${KNOWLEDGE_GRAPH_MAX_WORKSPACES:-32}"
      KNOWLEDGE_GRAPH_POOL_MAX_CONNECTIONS: "${KNOWLEDGE_GRAPH_POOL_MAX_CONNECTIONS:-8}"
      KNOWLEDGE_LOG_DIR: /var/log/knowledge
      KNOWLEDGE_SQL_LOG: "${KNOWLEDGE_SQL_LOG:-true}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/opt/huizhi-knowledge/app:ro
      - ./scripts:/opt/huizhi-knowledge/scripts:ro
      - ./data:/data
      - ${KNOWLEDGE_HOST_LOG_DIR:-./data/logs}:/var/log/knowledge
    command: ["python", "-m", "app.worker"]

  lightrag:
    image: "${KNOWLEDGE_IMAGE:-huizhi-runtime:2.2.1-arm64}"
    container_name: huizhi-lightrag
    restart: unless-stopped
    mem_limit: "${LIGHTRAG_MEMORY_LIMIT:-32g}"
    cpus: "${LIGHTRAG_CPU_LIMIT:-4.0}"
    pids_limit: "${LIGHTRAG_PIDS_LIMIT:-256}"
    env_file:
      - .env
    environment:
      LLM_BINDING: openai
      # CHAT_* is preferred; PROVIDER_* keeps existing deployments working.
      LLM_BINDING_HOST: "${CHAT_BASE_URL:-${PROVIDER_BASE_URL:-http://host.docker.internal:9988/v1}}"
      LLM_BINDING_API_KEY: "${CHAT_API_KEY:-${PROVIDER_API_KEY:-}}"
      OPENAI_API_KEY: "${CHAT_API_KEY:-${PROVIDER_API_KEY:-}}"
      LLM_MODEL: "${CHAT_MODEL:-llm}"
      EMBEDDING_BINDING: openai
      EMBEDDING_BINDING_HOST: "${EMBEDDING_BASE_URL:-http://host.docker.internal:9988/v1}"
      EMBEDDING_BINDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      OPENAI_EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-qwen3-4b-embedding}"
      EMBEDDING_DIM: "${EMBEDDING_DIMENSIONS:-1024}"
      SUMMARY_LANGUAGE: Chinese
      WORKING_DIR: /data/lightrag
      TIKTOKEN_CACHE_DIR: /data/lightrag/tiktoken_cache
      LIGHTRAG_API_KEY: "${LIGHTRAG_API_KEY:-}"
      # LightRAG's own setup_logger writes lightrag.log into LOG_DIR.
      LOG_DIR: /var/log/knowledge
      LOG_LEVEL: "${KNOWLEDGE_LOG_LEVEL:-INFO}"
    command: ["python", "-m", "lightrag.api.lightrag_server", "--host", "0.0.0.0", "--port", "9621"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${LIGHTRAG_PORT:-19621}:9621"
    volumes:
      - ./data/lightrag:/data/lightrag
      - ./data/lightrag-input:/data/lightrag-input
      - ${KNOWLEDGE_HOST_LOG_DIR:-./data/logs}:/var/log/knowledge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9621/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
