services:
  qwenpaw:
    image: "${MYCOPAW_IMAGE:-huizhi-runtime:2.2.1-amd64}"
    container_name: huizhi-assistant
    restart: unless-stopped
    # Resource ceilings keep one user's script/import from taking down the
    # whole host. Override these values in .env for the production machine.
    # Default ceilings for the production multi-user profile. Override via
    # .env when the host has a different capacity.
    mem_limit: "${QWENPAW_MEMORY_LIMIT:-48g}"
    cpus: "${QWENPAW_CPU_LIMIT:-8.0}"
    pids_limit: "${QWENPAW_PIDS_LIMIT:-512}"
    network_mode: host
    env_file:
      - .env
    environment:
      QWENPAW_PORT: "${COPAW_PORT:-8088}"
      TZ: "${TZ:-Asia/Shanghai}"
      QWENPAW_RUNNING_IN_CONTAINER: "1"
      QWENPAW_CODE_DIR: /workspace/app
      PYTHONPATH: /workspace/app/src
      QWENPAW_CONSOLE_STATIC_DIR: /workspace/app/console/dist
      QWENPAW_WORKING_DIR: /app/working
      QWENPAW_SECRET_DIR: /app/working.secret
      QWENPAW_BACKUP_DIR: /app/working.backups
      HADOOP_HOME: "${HADOOP_HOME:-/opt/hadoop}"
      HIVE_HOME: "${HIVE_HOME:-/opt/hive3}"
      HIVE2_HOME: "${HIVE2_HOME:-/opt/hive2}"
      HIVE3_HOME: "${HIVE3_HOME:-/opt/hive3}"
      ORACLE_HOME: "${ORACLE_HOME:-/opt/oracle/instantclient}"
      LD_LIBRARY_PATH: "${LD_LIBRARY_PATH:-/opt/oracle/instantclient:/usr/local/lib}"
      QWENPAW_AUTH_ENABLED: "${QWENPAW_AUTH_ENABLED:-true}"
      QWENPAW_AUTH_USERNAME: "${QWENPAW_AUTH_USERNAME:-admin}"
      QWENPAW_AUTH_PASSWORD: "${QWENPAW_AUTH_PASSWORD:-Admin@123456}"
      QWENPAW_FORCE_AUTH_ON_LOCALHOST: "${QWENPAW_FORCE_AUTH_ON_LOCALHOST:-true}"
      # Account databases live in the local PG17 container. These defaults
      # match knowledge-service/docker-compose.postgres.yml and require no
      # extra .env entries for the standard offline deployment.
      QWENPAW_DATA_TABLES_DB_HOST: "${QWENPAW_DATA_TABLES_DB_HOST:-127.0.0.1}"
      QWENPAW_DATA_TABLES_DB_PORT: "${QWENPAW_DATA_TABLES_DB_PORT:-15432}"
      QWENPAW_DATA_TABLES_DB_NAME: "${QWENPAW_DATA_TABLES_DB_NAME:-huizhi_knowledge}"
      QWENPAW_DATA_TABLES_DB_USER: "${QWENPAW_DATA_TABLES_DB_USER:-huizhi_knowledge}"
      QWENPAW_DATA_TABLES_DB_PASSWORD: "${QWENPAW_DATA_TABLES_DB_PASSWORD:-huizhi_knowledge}"
      # Console chat does not use a channel backend. A non-matching explicit
      # allow-list keeps every external channel module disabled.
      QWENPAW_ENABLED_CHANNELS: "${QWENPAW_ENABLED_CHANNELS:-console}"
      # Keep model pressure below the 8-core application ceiling. Requests
      # beyond this count wait in the shared limiter instead of causing
      # upstream timeouts when 8-10 users work at once.
      QWENPAW_LLM_MAX_CONCURRENT: "${QWENPAW_LLM_MAX_CONCURRENT:-6}"
      QWENPAW_LLM_STREAM_FIRST_CONTENT_TIMEOUT: "${QWENPAW_LLM_STREAM_FIRST_CONTENT_TIMEOUT:-300}"
      QWENPAW_LLM_STREAM_IDLE_TIMEOUT: "${QWENPAW_LLM_STREAM_IDLE_TIMEOUT:-300}"
      QWENPAW_LOG_LEVEL: "${QWENPAW_LOG_LEVEL:-info}"
      QWENPAW_LOG_DIR: /app/working/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/workspace/app:ro
      - ./code-mount-entrypoint.sh:/code-mount-entrypoint.sh:ro
      # The code-mount entrypoint delegates to /entrypoint.sh. Mount the
      # matching updated script too; older base images do not substitute the
      # QWENPAW_LOG_DIR placeholder used by the persistent log template.
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./data/working:/app/working
      - ./data/working.secret:/app/working.secret
      - ./data/backups:/app/working.backups
      # Host path is deliberately separate from QWENPAW_LOG_DIR, which is
      # the container path consumed by Python and Supervisor.
      - ${QWENPAW_HOST_LOG_DIR:-./data/logs}:/app/working/logs
    command: ["/bin/sh", "/code-mount-entrypoint.sh"]
