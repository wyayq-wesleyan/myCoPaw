services:
  highgo:
    build:
      context: .
    image: mycopaw/highgo:6.0.4.1-arm64
    platform: linux/arm64
    container_name: mycopaw-highgo
    restart: unless-stopped
    ports:
      - "${HIGHGO_PORT:-5866}:5866"
    environment:
      POSTGRES_PASSWORD: "${HIGHGO_PASSWORD:-Thiner@123}"
    volumes:
      - ./data:/home/highgo/hgdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5866 -U highgo -d highgo"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
